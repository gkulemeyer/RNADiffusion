experiment:
  name: "sim70_t10_e1"
  note: "ArchiveII sim70 fold0, t=10, epochs=1"
  seed: 42

data:
  base_path: "data/ArchiveII_max_length_128.csv"
  partition_path: "data/simfolds/simfolds_max128/ArchiveII_partitions_sim70.csv"
  fold: 0

model:
  timesteps: 10
  num_classes: 2
  in_channels: 18
  out_channels: 2
  base_dim: 64

training:
  max_epochs: 1
  batch_size: 4
  lr: 0.001
  num_workers: 2
  accelerator: "auto"
  devices: 1
  precision: 32

logging:
  save_dir: "logs/ArchiveII_sim_sweep/sim70/t10"
  tensorboard: true
  log_every_n_steps: 1
