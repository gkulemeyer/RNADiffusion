# @package _global_

pipeline:
  run_training: true
  run_testing: true
  run_ensemble_generation: false
  run_ensemble_analysis: false

training:
  batch_size: 4
  lr: 0.001
  epochs: 3
  num_workers: 2
  optimizer:
    type: adam
    weight_decay: 0.01

testing:
  batch_size: 8
  num_workers: 2
  fallback_test_path: null
  save_summary_csv: false
  summary_filename: all_test_summary.csv
