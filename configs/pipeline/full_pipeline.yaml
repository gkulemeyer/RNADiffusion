# @package _global_

pipeline:
  run_training: true
  run_testing: true
  run_ensemble_generation: true
  run_ensemble_analysis: true

training:
  batch_size: 4
  lr: 0.001
  epochs: 3
  num_workers: 2
  optimizer:
    type: adam
    weight_decay: 0.01

testing:
  batch_size: 8
  num_workers: 2
  fallback_test_path: null
  save_summary_csv: false
  summary_filename: all_test_summary.csv

ensemble:
  batch_size: 8
  num_workers: 2
  num_samples: 50
  base_seed: ${seed}

ensemble_stats:
  trials: 20
  consensus_sizes: [1, 3, 5, 7, 9, 11, 15, 21, 25]
