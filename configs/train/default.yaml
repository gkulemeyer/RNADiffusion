experiment:
  name: ""
  note: "Base RNADiffusion training config"
  seed: 42

data:
  base_path: "data/ArchiveII_max_length_128.csv"
  partition_path: "data/others/ArchiveII_splits.csv"
  partition_scheme: "simfold"
  fold: 0

model:
  timesteps: 5
  num_classes: 2
  loss_type: "vb_all"
  in_channels: 18
  out_channels: 2
  base_dim: 32

training:
  max_epochs: 10
  batch_size: 1
  accumulate_grad_batches: 4
  check_val_every_n_epoch: 1
  lr: 0.001
  num_workers: 2
  accelerator: "auto"
  devices: 1
  precision: "16-mixed"

logging:
  save_dir: "logs/RNADiffusion"
  tensorboard: true
  log_every_n_steps: 1
  checkpoint_every_n_epochs: 1
