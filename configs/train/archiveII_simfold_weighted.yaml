experiment:
  name: ""
  note: "ArchiveII simfold training config"
  seed: 42

data:
  base_path: "data/ArchiveII.csv"
  partition_path: "data/simfolds/boostrap/archiveII_similars_splits_less_than_512_k10_boostrap_{partition}-fold.csv"
  partition_scheme: "simfold"
  fold: 0 

model:
  evaluate: true
  load_pretrained: false
  pretrained_path: "path/to/pretrained/model.ckptS"
  timesteps: 5
  type: weighted # weighted | none
  model_kwargs:
    balance_bp: class # class | linear_convex |none
    w: 0.02 
    lambda_valid: 1.0 
